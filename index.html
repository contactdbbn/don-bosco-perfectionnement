<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#315efb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Don Bosco">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Don Bosco - Perfectionnement — Présences</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div><strong>Don Bosco - Perfectionnement</strong><span class="sub">Gestion des présences</span></div>
    <div class="role-box">
      <label for="roleSelect">Mode</label>
      <select id="roleSelect">
        <option value="member">Adhérent</option>
        <option value="coach">Encadrant</option>
        <option value="admin">Administrateur</option>
      </select>
    </div>
    <div id="currentUserName" class="current-user-name" title="Utilisateur connecté"></div>
    <div id="connectionStatus" class="connection-status" title="État de la connexion">● En ligne</div>
    <button id="syncNowBtn" class="secondary" onclick="v60ManualSync()">↻ Synchroniser</button>
    <button id="notifyBtn" class="secondary">🔔 Activer les notifications</button>
    <button id="profileBtn" class="secondary" onclick="openProfileMenu()">Profil</button>
  </header>

  <main class="container">

  <nav class="tabs top-tabs">
      <button class="tab active" data-view="dashboard">Présences</button>
      <button class="tab" data-view="members" id="membersTab">Adhérents</button>
      <button class="tab" data-view="tdb" id="tdbTab">TDB</button>
      <button class="tab" data-view="calendar">Calendrier</button>
      <button class="tab" data-view="events">Événements</button>
      <button class="tab" data-view="member-history">Mon suivi</button>
      <button class="tab" data-view="objectives" id="objectivesTab">Objectifs</button>
      <button class="tab" data-view="moves" id="movesTab">Demandes <span id="moveBadge" class="badge"></span></button>
      <button class="tab" data-view="request-history" id="requestHistoryTab">Mes demandes</button>
    </nav>

    <section id="dashboardView" class="view"></section>
    <section id="tdbView" class="view hidden"></section>
    <section id="membersView" class="view hidden"></section>
    <section id="calendarView" class="view hidden"></section>
    <section id="eventsView" class="view hidden"></section>
    <section id="member-historyView" class="view hidden"></section>
    <section id="objectivesView" class="view hidden"></section>
    <section id="movesView" class="view hidden"></section>
    <section id="request-historyView" class="view hidden"></section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js?v=20260911-v85"></script>
  <script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {})); }</script>
</body>
</html>
